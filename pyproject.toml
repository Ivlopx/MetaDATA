[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-metadata-manager"
version = "0.4.0a1"
description = "Administrador local de metadatos para RadioCaster"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7", "httpx>=0.27,<1", "defusedxml>=0.7,<1",
  "keyring>=25.6,<26; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
radio-metadata = "radio_metadata.__main__:main"

[tool.setuptools.packages.find]
include = ["radio_metadata*"]

[tool.setuptools.package-data]
radio_metadata = ["assets/*.svg", "assets/*.png", "assets/README.md"]
